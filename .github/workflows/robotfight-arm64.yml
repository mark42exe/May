name: Robot Fight ARM64 APK

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    paths:
      - "robotfight/android/**"
      - "tools/extract_robotfight_dca.py"
      - ".github/workflows/robotfight-arm64.yml"

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the Robot Fight source ZIP from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/rf-source"
          gh release download --repo "$GH_REPO" --pattern '*.zip' --dir "$RUNNER_TEMP/rf-source"
          ARCHIVE="$(find "$RUNNER_TEMP/rf-source" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/rf-unpacked"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/rf-unpacked"
          PROJECT_DIR="$(dirname "$(find "$RUNNER_TEMP/rf-unpacked" -type f -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using source project: $PROJECT_DIR"

      - name: Integrate offline game UI and recovered original art
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/assets/robotfight_original/art"
          cp robotfight/android/index.html "$PROJECT_DIR/app/src/main/assets/index.html"
          cp robotfight/android/MainActivity.kt "$PROJECT_DIR/app/src/main/java/com/robotfight/offline/MainActivity.kt"
          cp robotfight/android/AndroidManifest.xml "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          python3 tools/extract_robotfight_dca.py "$PROJECT_DIR/app/src/main/assets/robotfight_original/gamedata.dca" "$PROJECT_DIR/app/src/main/assets/robotfight_original/art"
          test "$(find "$PROJECT_DIR/app/src/main/assets/robotfight_original/art" -type f -name '*.webp' | wc -l)" -gt 1000
          echo "Integrated recovered WebP art resources"

      - name: Audit original scenes, animation data, atlases, and metadata
        run: |
          python3 tools/audit_robotfight_assets.py "$PROJECT_DIR/app/src/main/assets/robotfight_original/art" --out "$RUNNER_TEMP/robotfight_asset_inventory.json"
          test -s "$RUNNER_TEMP/robotfight_asset_inventory.json"
          python3 - "$PROJECT_DIR/app/src/main/assets/robotfight_original/art" "$RUNNER_TEMP/robotfight_ccb_headers.txt" <<'PY'
          from pathlib import Path
          import sys, collections
          root, out = Path(sys.argv[1]), Path(sys.argv[2])
          files = sorted(root.rglob("*.ccb"))
          counts = collections.Counter()
          lines = [f"CCB files: {len(files)}"]
          for p in files:
              data = p.read_bytes()
              b = data[:32]
              kind = "CCBI" if b[:4] == b"ccbi" else "binary-plist" if b.startswith(b"bplist00") else "xml-plist" if b.lstrip().startswith(b"<?xml") else "unknown/custom"
              counts[kind] += 1
              if sum(x.startswith("SAMPLE ") for x in lines) < 30:
                  lines.append(f"SAMPLE {p.relative_to(root)} | {len(data)} bytes | {kind} | {b.hex()}")
          lines.append("COUNTS " + repr(dict(counts)))
          out.write_text("\n".join(lines) + "\n")
          print(out.read_text())
          PY

      - name: Upload CCB scene format samples
        uses: actions/upload-artifact@v4
        with:
          name: RobotFight-CCB-Scene-Headers
          path: ${{ runner.temp }}/robotfight_ccb_headers.txt
          if-no-files-found: error

      - name: Package original RCCB scene samples
        run: |
          mkdir -p "$RUNNER_TEMP/rccb-scenes"
          find "$PROJECT_DIR/app/src/main/assets/robotfight_original/art" -type f -name "*.ccb" -exec cp --parents {} "$RUNNER_TEMP/rccb-scenes/" \;
          (cd "$RUNNER_TEMP/rccb-scenes" && zip -qr "$RUNNER_TEMP/RobotFight-Original-RCCB-Scenes.zip" .)

      - name: Upload original RCCB scene samples
        uses: actions/upload-artifact@v4
        with:
          name: RobotFight-Original-RCCB-Scenes
          path: ${{ runner.temp }}/RobotFight-Original-RCCB-Scenes.zip
          if-no-files-found: error

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build ARM64 debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify ARM64 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          # Fix the ELF64 program-header parser in the supplied source archive:
          # p_paddr is at +24; p_filesz is at +32.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/verify_arm64_apk.py")
          s = p.read_text()
          wrong = 'p_offset, p_vaddr, p_filesz = struct.unpack_from(endian + "QQQ", data, off + 8)'
          right = 'p_offset, p_vaddr = struct.unpack_from(endian + "QQ", data, off + 8)\n        p_filesz = struct.unpack_from(endian + "Q", data, off + 32)[0]'
          if wrong in s:
              p.write_text(s.replace(wrong, right))
          elif right not in s:
              raise SystemExit("Could not identify expected ELF parser line")
          PY
          python3 tools/verify_arm64_apk.py "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobotFight-ARM64-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload recovered asset inventory
        uses: actions/upload-artifact@v4
        with:
          name: RobotFight-Recovered-Asset-Inventory
          path: ${{ runner.temp }}/robotfight_asset_inventory.json
          if-no-files-found: error
