name: Robot Fight ARM64 APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the Robot Fight source ZIP from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/rf-source"
          gh release download --repo "$GH_REPO" --pattern '*.zip' --dir "$RUNNER_TEMP/rf-source"
          ARCHIVE="$(find "$RUNNER_TEMP/rf-source" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/rf-unpacked"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/rf-unpacked"
          PROJECT_DIR="$(dirname "$(find "$RUNNER_TEMP/rf-unpacked" -type f -name settings.gradle.kts -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using source project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build ARM64 debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify ARM64 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          python3 tools/verify_arm64_apk.py "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobotFight-ARM64-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
