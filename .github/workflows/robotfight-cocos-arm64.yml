name: Robot Fight Native Cocos ARM64 Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - "robotfight/cocos/**"
      - "tools/import_robotfight_assets.py"
      - ".github/workflows/robotfight-cocos-arm64.yml"

permissions:
  contents: read

jobs:
  cocos-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;23.1.7779620" "cmake;3.22.1"

      - name: Download Cocos2d-x v4 engine and template
        run: |
          git clone --depth 1 --branch v4 https://github.com/cocos2d/cocos2d-x.git "$RUNNER_TEMP/cocos2d-x"
          mkdir -p "$RUNNER_TEMP/rf-cocos"
          cp -a "$RUNNER_TEMP/cocos2d-x/templates/cpp-template-default/." "$RUNNER_TEMP/rf-cocos/"
          cp -a "$RUNNER_TEMP/cocos2d-x" "$RUNNER_TEMP/rf-cocos/cocos2d"
          cd "$RUNNER_TEMP/rf-cocos/cocos2d"
          # Cocos v4 declares several submodules with the legacy git:// transport.
          # GitHub Actions runners may block that port, so rewrite it to HTTPS.
          git config --global url."https://github.com/".insteadOf git://github.com/
          git submodule update --init --recursive
          # The dependency helper prompts whether to keep its downloaded ZIP;
          # CI is non-interactive, so answer 'no' explicitly.
          printf 'no\\n' | python3 download-deps.py
          echo "PROJECT_DIR=$RUNNER_TEMP/rf-cocos" >> "$GITHUB_ENV"

      - name: Configure native ARM64 project
        run: |
          sed -i 's/PROP_COMPILE_SDK_VERSION=28/PROP_COMPILE_SDK_VERSION=33/' "$PROJECT_DIR/proj.android/gradle.properties"
          sed -i 's/PROP_MIN_SDK_VERSION=16/PROP_MIN_SDK_VERSION=23/' "$PROJECT_DIR/proj.android/gradle.properties"
          sed -i 's/PROP_TARGET_SDK_VERSION=28/PROP_TARGET_SDK_VERSION=33/' "$PROJECT_DIR/proj.android/gradle.properties"
          sed -i 's/PROP_APP_ABI=armeabi-v7a/PROP_APP_ABI=arm64-v8a/' "$PROJECT_DIR/proj.android/gradle.properties"
          sed -i "s/com.android.tools.build:gradle:3.4.0/com.android.tools.build:gradle:7.4.2/" "$PROJECT_DIR/proj.android/build.gradle"
          sed -i 's/jcenter()/mavenCentral()/g' "$PROJECT_DIR/proj.android/build.gradle"
          sed -i 's/HelloCpp/RobotFightNative/g' "$PROJECT_DIR/proj.android/settings.gradle"
          sed -i 's/HelloCpp/RobotFightNative/g' "$PROJECT_DIR/proj.android/app/build.gradle"
          sed -i 's/applicationId "org.cocos2dx.hellocpp"/applicationId "com.robotfight.nativeport"/' "$PROJECT_DIR/proj.android/app/build.gradle"
          sed -i 's/APP_NAME HelloCpp/APP_NAME RobotFightNative/' "$PROJECT_DIR/CMakeLists.txt"
          # The NDK defines __ANDROID__; Cocos v4 only checks ANDROID here.
          # Recognise the standard NDK macro so CC_TARGET_PLATFORM resolves to Android.
          sed -i 's/^#if defined(ANDROID)$/#if defined(ANDROID) || defined(__ANDROID__)/' "$PROJECT_DIR/cocos2d/cocos/platform/CCPlatformConfig.h"
          sed -i 's/"HelloCpp"/"Robot Fight Native"/g' "$PROJECT_DIR/Classes/AppDelegate.cpp"
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="landscape"/' "$PROJECT_DIR/proj.android/app/AndroidManifest.xml"
          sed -i 's/android:label="[^"]*"/android:label="Robot Fight Native"/' "$PROJECT_DIR/proj.android/app/AndroidManifest.xml"
          # Android 12+ requires an explicit exported value on launcher activities.
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          manifest = Path(os.environ["PROJECT_DIR"]) / "proj.android/app/AndroidManifest.xml"
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          found = False
          for activity in root.findall(".//activity"):
              is_launcher = False
              for intent in activity.findall("intent-filter"):
                  actions = {node.get(ns + "name") for node in intent.findall("action")}
                  categories = {node.get(ns + "name") for node in intent.findall("category")}
                  if "android.intent.action.MAIN" in actions and "android.intent.category.LAUNCHER" in categories:
                      is_launcher = True
                      break
              if is_launcher:
                  activity.set(ns + "exported", "true")
                  found = True
          if not found:
              raise SystemExit("No MAIN/LAUNCHER activity found in generated manifest")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY
          sed -i 's/PROP_BUILD_TYPE=.*/PROP_BUILD_TYPE=cmake/' "$PROJECT_DIR/proj.android/gradle.properties" || true
          mkdir -p "$PROJECT_DIR/Resources"
          mkdir -p "$PROJECT_DIR/Classes"
          # Copy the complete checked-in game source directory, then verify every input
          # before CMake runs. This avoids silent partial copies and path assumptions.
          cp -av robotfight/cocos/Classes/. "$PROJECT_DIR/Classes/"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          project = Path(os.environ["PROJECT_DIR"])
          classes = project / "Classes"
          required = [
              "HelloWorldScene.cpp",
              "HelloWorldScene.h",
              "RobotFightCore.cpp",
              "RobotFightCore.h",
          ]
          missing = [name for name in required if not (classes / name).is_file() or (classes / name).stat().st_size == 0]
          if missing:
              raise SystemExit("Missing or empty native source files: " + ", ".join(missing))
          cmake = project / "CMakeLists.txt"
          source = cmake.read_text()
          # Add the battle module as a target source rather than editing the template's
          # GAME_SOURCE/GAME_HEADER lists (their layout differs between Cocos templates).
          if "target_sources(${APP_NAME} PRIVATE" not in source:
              match = re.search(r"add_library\s*\(\s*\$\{APP_NAME\}", source)
              if not match:
                  raise SystemExit("Could not locate Cocos add_library(${APP_NAME} ...) target")
              source += "\n\n# Robot Fight offline battle logic\ntarget_sources(${APP_NAME} PRIVATE ${CMAKE_CURRENT_SOURCE_DIR}/Classes/RobotFightCore.cpp)\n"
              cmake.write_text(source)
          if "RobotFightCore.cpp" not in cmake.read_text():
              raise SystemExit("RobotFightCore.cpp was not registered with CMake")
          print("Native source preflight passed:", ", ".join(required))
          print("CMake target source registration passed")
          PY
          test -s "$PROJECT_DIR/Classes/HelloWorldScene.cpp"
          test -s "$PROJECT_DIR/Classes/HelloWorldScene.h"
          test -s "$PROJECT_DIR/Classes/RobotFightCore.cpp"
          test -s "$PROJECT_DIR/Classes/RobotFightCore.h"

      - name: Fetch original scene bundle from verified workflow artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42789600523 --repo "${GITHUB_REPOSITORY}" --name "RobotFight-Original-RCCB-Scenes" --dir "$RUNNER_TEMP/rccb-artifact"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "rccb-artifact"
          target = Path(__import__("os").environ["PROJECT_DIR"]) / "Resources"
          for archive in root.rglob("*.zip"):
              with ZipFile(archive) as z:
                  z.extractall(target)
          scenes = list(target.rglob("*.ccb"))
          battle = [p for p in scenes if p.name == "RFBattleLayer.ccb"]
          print("Recovered scene files:", len(scenes))
          if len(scenes) != 138 or not battle:
              raise SystemExit("Original battle scene bundle is incomplete")
          # Cocos FileUtils resolves this resource from the Resources root.
          import shutil
          shutil.copy2(battle[0], target / "RFBattleLayer.ccb")
          PY

      - name: Fetch recovered original Toy Attack asset APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-pack"
          gh run download 42789600523 --repo "$GITHUB_REPOSITORY" --name "RobotFight-ARM64-debug" --dir "$RUNNER_TEMP/original-pack"
          ORIGINAL_APK="$RUNNER_TEMP/original-pack/app-debug.apk"
          test -s "$ORIGINAL_APK"
          python3 - "$ORIGINAL_APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              required = "assets/robotfight_original/gamedata.dca"
              if required not in names:
                  raise SystemExit("Recovered APK does not contain the original DCA asset archive")
              manifest = "assets/robotfight_original/art/_archive_manifest.json"
              if manifest not in names:
                  raise SystemExit("Recovered APK is missing the original asset manifest")
              import json
              data = json.loads(z.read(manifest))
              if data.get("count") != 3232:
                  raise SystemExit(f"Unexpected original asset count: {data.get('count')}")
              print("Verified recovered original archive:", data["count"], "entries")
          PY
          echo "ORIGINAL_APK=$ORIGINAL_APK" >> "$GITHUB_ENV"

      - name: Import complete original Toy Attack resources
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 tools/import_robotfight_assets.py --input "$ORIGINAL_APK" --output "$PROJECT_DIR/Resources/original"
          python3 - "$PROJECT_DIR/Resources/original" <<'PY'
          from pathlib import Path
          import json, sys
          root = Path(sys.argv[1])
          manifest = json.loads((root / "original_asset_manifest.json").read_text())
          files = manifest["imported_files"]
          if files < 3000:
              raise SystemExit(f"Original resource import incomplete: only {files} files")
          for required in ("RFBattleLayer.ccb", "RFMainLayer.ccb", "RFEditorLayer.ccb", "RFPartsData.plist"):
              if not (root / required).is_file():
                  raise SystemExit(f"Required original resource missing: {required}")
          print("Verified original resource import:", files, "files")
          print("Image conversion counts:", manifest["counts"])
          PY

      - name: Update Android Gradle wrapper
        run: |
          sed -i 's/gradle-5.1.1-all/gradle-7.6.3-bin/' "$PROJECT_DIR/proj.android/gradle/wrapper/gradle-wrapper.properties"
          sed -i 's/com.android.tools.build:gradle:7.4.2/com.android.tools.build:gradle:7.4.2/' "$PROJECT_DIR/proj.android/build.gradle"

      - name: Build native Cocos ARM64 APK
        working-directory: ${{ env.PROJECT_DIR }}/proj.android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :RobotFightNative:assembleDebug

      - name: Verify and stage native ARM64 APK
        run: |
          set -e
          APK="$PROJECT_DIR/proj.android/app/build/outputs/apk/debug/RobotFightNative-debug.apk"
          echo "Expected APK: $APK"
          if [ ! -s "$APK" ]; then
            echo "APK missing; locating generated APKs:"
            find "$PROJECT_DIR/proj.android" -type f -name '*.apk' -print
            exit 1
          fi
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt APK entry: {bad}")
              libs = [n for n in z.namelist() if n.endswith(".so")]
              print("Native libraries packaged:", libs)
              arm64 = [n for n in libs if n.startswith("lib/arm64-v8a/")]
              if not arm64:
                  raise SystemExit("APK does not contain an arm64-v8a native library")
          PY
          mkdir -p "$RUNNER_TEMP/native-apk"
          cp "$APK" "$RUNNER_TEMP/native-apk/RobotFight-Cocos-ARM64-offline-core.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RobotFight-Cocos-ARM64-Offline-Core
          path: ${{ runner.temp }}/native-apk/RobotFight-Cocos-ARM64-offline-core.apk
          if-no-files-found: error
