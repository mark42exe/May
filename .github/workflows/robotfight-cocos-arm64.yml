name: Toy Attack ARM64 Port Validation (No APK)

on:
  workflow_dispatch:
  push:
    paths:
      - "robotfight/cocos/**"
      - "tools/import_robotfight_assets.py"
      - "tools/audit_robot_part_geometry.py"
      - ".github/workflows/robotfight-cocos-arm64.yml"

permissions:
  contents: read

jobs:
  cocos-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install legacy NDK required by original Cocos 3.15.1
        run: |
          sdkmanager "platform-tools" "ndk;16.1.4479499"

      - name: Download original Cocos2d-x 3.15.1 engine and template
        run: |
          git clone --depth 1 --branch cocos2d-x-3.15.1 https://github.com/cocos2d/cocos2d-x.git "$RUNNER_TEMP/cocos2d-x"
          mkdir -p "$RUNNER_TEMP/rf-cocos"
          cp -a "$RUNNER_TEMP/cocos2d-x/templates/cpp-template-default/." "$RUNNER_TEMP/rf-cocos/"
          cp -a "$RUNNER_TEMP/cocos2d-x" "$RUNNER_TEMP/rf-cocos/cocos2d"
          echo "PROJECT_DIR=$RUNNER_TEMP/rf-cocos" >> "$GITHUB_ENV"

      - name: Patch legacy Cocos audio header for modern ARM64 compiler
        run: |
          set -euo pipefail
          SOURCE="$PROJECT_DIR/cocos2d/cocos/audio/android/mp3reader.cpp"
          test -s "$SOURCE"
          python3 - "$SOURCE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          if "#include <string.h>" not in source:
              source = "#include <string.h>\\n" + source
              path.write_text(source)
          if "memcmp(\"ID3\"" not in source or "memcpy(buf" not in source:
              raise SystemExit("Unexpected mp3reader.cpp; refusing an unsafe patch")
          print("Verified string.h declarations for memcmp/memcpy")
          PY

      - name: Patch legacy Cocos allocator header for modern ARM64 compiler
        run: |
          set -euo pipefail
          SOURCE="$PROJECT_DIR/cocos2d/cocos/base/allocator/CCAllocatorStrategyGlobalSmallBlock.h"
          test -s "$SOURCE"
          python3 - "$SOURCE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          if "#include <string.h>" not in source:
              source = "#include <string.h>\\n" + source
              path.write_text(source)
          if "memset(_smallBlockAllocators" not in source:
              raise SystemExit("Unexpected allocator header; refusing an unsafe patch")
          print("Verified string.h declarations for allocator memset")
          PY

      - name: Patch legacy Cocos process tracker POSIX declarations
        run: |
          set -euo pipefail
          SOURCE="$PROJECT_DIR/cocos2d/cocos/platform/android/jni/ProcessCpuTracker.cpp"
          test -s "$SOURCE"
          python3 - "$SOURCE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          if "#include <unistd.h>" not in source:
              source = "#include <unistd.h>\\n" + source
              path.write_text(source)
          if "read(fd, buffer" not in source or "close(fd)" not in source:
              raise SystemExit("Unexpected ProcessCpuTracker.cpp; refusing an unsafe patch")
          print("Verified POSIX read/close declarations")
          PY

      - name: Install Cocos 3.15.1 third-party native dependencies
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/cocos3rdparty.zip"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/cocos2d/cocos2d-x-3rd-party-libs-bin/archive/refs/tags/v3-deps-130.zip" \
            -o "$ARCHIVE"
          python3 - "$ARCHIVE" "$PROJECT_DIR/cocos2d/external" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil, sys, tempfile
          archive, destination = Path(sys.argv[1]), Path(sys.argv[2])
          with tempfile.TemporaryDirectory() as tmp:
              with ZipFile(archive) as z:
                  z.extractall(tmp)
              roots = [p for p in Path(tmp).iterdir() if p.is_dir()]
              if len(roots) != 1:
                  raise SystemExit("Unexpected Cocos third-party archive layout")
              shutil.copytree(roots[0], destination, dirs_exist_ok=True)
          for required in ("freetype2/prebuilt/android/Android.mk", "openssl/prebuilt/android/Android.mk"):
              if not (destination / required).is_file():
                  raise SystemExit("Missing Cocos dependency: " + required)
          print("Cocos third-party dependencies installed and verified")
          PY

      - name: Configure original Cocos 3.15.1 for ARM64
        run: |
          set -euo pipefail
          sed -i 's/^APP_ABI := .*/APP_ABI := arm64-v8a\nAPP_PLATFORM := android-21/' "$PROJECT_DIR/proj.android-studio/app/jni/Application.mk"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["PROJECT_DIR"])
          mk = root / "proj.android-studio/app/jni/Android.mk"
          text = mk.read_text()
          old = "                   ../../../Classes/HelloWorldScene.cpp"
          new = old + " \\\n                   ../../../Classes/RobotFightCore.cpp"
          if old not in text:
              raise SystemExit("Could not find original game source registration in Android.mk")
          mk.write_text(text.replace(old, new))
          PY
          mkdir -p "$PROJECT_DIR/Resources"
          mkdir -p "$PROJECT_DIR/Classes"
          # Copy the complete checked-in game source directory, then verify every input
          # before native compilation. This avoids silent partial copies and path assumptions.
          cp -av robotfight/cocos/Classes/. "$PROJECT_DIR/Classes/"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          project = Path(os.environ["PROJECT_DIR"])
          classes = project / "Classes"
          required = [
              "HelloWorldScene.cpp",
              "HelloWorldScene.h",
              "RobotFightCore.cpp",
              "RobotFightCore.h",
          ]
          missing = [name for name in required if not (classes / name).is_file() or (classes / name).stat().st_size == 0]
          if missing:
              raise SystemExit("Missing or empty native source files: " + ", ".join(missing))
          print("Native source preflight passed:", ", ".join(required))
          PY
          test -s "$PROJECT_DIR/Classes/HelloWorldScene.cpp"
          test -s "$PROJECT_DIR/Classes/HelloWorldScene.h"
          test -s "$PROJECT_DIR/Classes/RobotFightCore.cpp"
          test -s "$PROJECT_DIR/Classes/RobotFightCore.h"

      - name: Fetch original scene bundle from verified workflow artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42789600523 --repo "${GITHUB_REPOSITORY}" --name "RobotFight-Original-RCCB-Scenes" --dir "$RUNNER_TEMP/rccb-artifact"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "rccb-artifact"
          target = Path(__import__("os").environ["PROJECT_DIR"]) / "Resources"
          for archive in root.rglob("*.zip"):
              with ZipFile(archive) as z:
                  z.extractall(target)
          scenes = list(target.rglob("*.ccb"))
          battle = [p for p in scenes if p.name == "RFBattleLayer.ccb"]
          print("Recovered scene files:", len(scenes))
          if len(scenes) != 138 or not battle:
              raise SystemExit("Original battle scene bundle is incomplete")
          # Cocos FileUtils resolves this resource from the Resources root.
          import shutil
          shutil.copy2(battle[0], target / "RFBattleLayer.ccb")
          PY

      - name: Fetch recovered original Toy Attack asset APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-pack"
          gh run download 42789600523 --repo "$GITHUB_REPOSITORY" --name "RobotFight-ARM64-debug" --dir "$RUNNER_TEMP/original-pack"
          ORIGINAL_APK="$RUNNER_TEMP/original-pack/app-debug.apk"
          test -s "$ORIGINAL_APK"
          python3 - "$ORIGINAL_APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              required = "assets/robotfight_original/gamedata.dca"
              if required not in names:
                  raise SystemExit("Recovered APK does not contain the original DCA asset archive")
              manifest = "assets/robotfight_original/art/_archive_manifest.json"
              if manifest not in names:
                  raise SystemExit("Recovered APK is missing the original asset manifest")
              import json
              data = json.loads(z.read(manifest))
              if data.get("count") != 3232:
                  raise SystemExit(f"Unexpected original asset count: {data.get('count')}")
              print("Verified recovered original archive:", data["count"], "entries")
          PY
          echo "ORIGINAL_APK=$ORIGINAL_APK" >> "$GITHUB_ENV"

      - name: Import complete original Toy Attack resources
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 tools/import_robotfight_assets.py --input "$ORIGINAL_APK" --output "$PROJECT_DIR/Resources/original"
          python3 - "$PROJECT_DIR/Resources/original" <<'PY'
          from pathlib import Path
          import json, sys
          root = Path(sys.argv[1])
          manifest = json.loads((root / "original_asset_manifest.json").read_text())
          files = manifest["imported_files"]
          if files < 3000:
              raise SystemExit(f"Original resource import incomplete: only {files} files")
          for required in ("RFBattleLayer.ccb", "RFMainLayer.ccb", "RFEditorLayer.ccb", "RFPartsData.plist", "Normal1.ogg", "bgm_scene_battleFight.wav", "sfx_btn_press.ogg"):
              if not (root / required).is_file():
                  raise SystemExit(f"Required original resource missing: {required}")
          print("Verified original resource import:", files, "files")
          print("Image conversion counts:", manifest["counts"])
          PY

      - name: Audit original robot part geometry and image references
        run: |
          python3 tools/audit_robot_part_geometry.py "$PROJECT_DIR/Resources/original" --out "$RUNNER_TEMP/robot_part_geometry_audit.json"

      - name: Upload original robot geometry audit
        uses: actions/upload-artifact@v4
        with:
          name: RobotFight-Original-Part-Geometry-Audit
          path: ${{ runner.temp }}/robot_part_geometry_audit.json
          if-no-files-found: error

      - name: Install compatibility libraries for legacy NDK r16b
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legacy-libs"
          cd "$RUNNER_TEMP/legacy-libs"
          curl -fL --retry 3 --retry-delay 2 \
            https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2ubuntu0.3_amd64.deb \
            -o libncurses5.deb
          curl -fL --retry 3 --retry-delay 2 \
            https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.3_amd64.deb \
            -o libtinfo5.deb
          sudo dpkg -i ./libtinfo5.deb ./libncurses5.deb
          ldconfig -p | grep -E 'libncurses.so.5|libtinfo.so.5'

      - name: Compile original Cocos 3.15.1 native library for ARM64 only (no APK)
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/16.1.4479499"
          test -x "$NDK/ndk-build"
          "$NDK/ndk-build" -C "$PROJECT_DIR/proj.android-studio/app" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_MODULE_PATH="$PROJECT_DIR/cocos2d:$PROJECT_DIR/cocos2d/cocos:$PROJECT_DIR/cocos2d/external" \
            APP_ABI=arm64-v8a
          find "$PROJECT_DIR/proj.android-studio/app/obj/local/arm64-v8a" -type f -name '*.so' -print
          test -s "$PROJECT_DIR/proj.android-studio/app/obj/local/arm64-v8a/libMyGame.so"
          file "$PROJECT_DIR/proj.android-studio/app/obj/local/arm64-v8a/libMyGame.so"
          echo "Cocos 3.15.1 ARM64 native compilation passed. No APK was assembled or uploaded."
