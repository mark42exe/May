name: RCCB scene structure report

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/inspect_rccb.py"
      - ".github/workflows/rccb-inspect.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download verified RCCB scene artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42789600523 --repo "${GITHUB_REPOSITORY}" --name "RobotFight-Original-RCCB-Scenes" --dir /tmp/rf-artifact
      - name: Extract nested scene archive
        run: |
          mkdir -p /tmp/rf-source
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          import shutil
          root = Path("/tmp/rf-artifact")
          out = Path("/tmp/rf-source")
          archives = list(root.rglob("*.zip"))
          if not archives:
              raise SystemExit("No scene ZIP found in downloaded workflow artifact")
          for archive in archives:
              try:
                  with ZipFile(archive) as z:
                      z.extractall(out)
              except BadZipFile:
                  continue
          scenes = list(out.rglob("*.ccb"))
          print(f"Recovered RCCB scene files: {len(scenes)}")
          if len(scenes) < 100:
              raise SystemExit("Expected at least 100 original .ccb scenes")
          PY
      - name: Inspect RCCB scenes
        run: |
          python tools/inspect_rccb.py /tmp/rf-source --output rccb-scene-report.json
          python - <<'PY'
          import json
          d=json.load(open("rccb-scene-report.json"))
          print("Scene count:", d["scene_count"])
          print("Magic counts:", d["magic_counts"])
          for s in d["scenes"]:
              if s["file"] == "RFBattleLayer.ccb":
                  print("Battle scene node classes:", s["node_type_counts"])
                  print("Battle scene resource references:", len(s["resource_references"]))
          assert d["scene_count"] >= 100, "Expected recovered original scene files"
          assert set(d["magic_counts"]) == {"RCCB"}, "Unexpected scene magic"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RobotFight-RCCB-Structure-Report
          path: rccb-scene-report.json
          if-no-files-found: error
