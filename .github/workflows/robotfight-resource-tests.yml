name: Toy Attack Resource Import Tests

on:
  push:
    paths:
      - "tools/import_robotfight_assets.py"
      - "tools/validate_imported_robotfight_resources.py"
      - "tests/test_robotfight_asset_import.py"
      - ".github/workflows/robotfight-resource-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-import-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Run asset importer regression tests
        run: python -m unittest discover -s tests -p "test_robotfight_asset_import.py" -v
      - name: Compile Python tools
        run: python -m py_compile tools/import_robotfight_assets.py tools/validate_imported_robotfight_resources.py tests/test_robotfight_asset_import.py
